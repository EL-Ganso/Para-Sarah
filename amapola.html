<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para ti 🌸</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            background-color: #090a0f; 
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: 'Poppins', sans-serif;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .textos {
            position: absolute;
            bottom: 5%;
            z-index: 2;
            text-align: center;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 4.5rem;
            color: #ff9a9e;
            text-shadow: 0 0 10px rgba(0,0,0,0.8), 0 0 20px rgba(255, 154, 158, 0.8);
            margin: 0;
            opacity: 0;
            animation: aparecerTexto 3s ease 3.5s forwards; 
        }

        h2 {
            font-size: 1.2rem;
            color: #dfe6e9;
            font-weight: 400;
            margin: 0;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
            opacity: 0;
            animation: aparecerTexto 3s ease 4.5s forwards; 
            padding: 0 20px;
        }

        @keyframes aparecerTexto {
            to { opacity: 1; transform: translateY(-20px); }
        }

        /* === SUCULENTAS === */
        .jardin {
            position: absolute;
            left: 0; right: 0; bottom: 40px;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            pointer-events: none;
            z-index: 0;
            padding: 0 1vw;
        }
        .sucu {
            width: var(--w);
            flex: none;
            transform-origin: 50% 100%;
            animation: brotar 1.3s cubic-bezier(.34, 1.56, .64, 1) var(--d) both,
                       mecer 6s ease-in-out calc(var(--d) + 1.4s) infinite;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, .35));
        }
        .sucu svg { display: block; width: 100%; height: auto; }
        @keyframes brotar { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes mecer { 0%, 100% { transform: rotate(-1.6deg); } 50% { transform: rotate(1.6deg); } }

        /* === MEJORAS === */
        .jardin { position: fixed; bottom: 0; z-index: 2; width: min(36vw, 340px); padding: 0; justify-content: space-between; }
        .jardin.izq { left: 8px; right: auto; }
        .jardin.der { right: 8px; left: auto; }
        h3.pd {
            font-size: 1rem; font-weight: 400; color: #b2bec3; margin: 6px 0 0;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
            opacity: 0; animation: aparecerTexto 3s ease 7s forwards; padding: 0 20px;
        }

        a.siguiente {
            position: fixed; top: 18px; right: 18px; z-index: 5;
            font-family: 'Poppins', sans-serif; font-size: .95rem; font-weight: 600;
            color: #fff; text-decoration: none;
            background: linear-gradient(45deg, #ff7675, #d63031);
            padding: 10px 22px; border-radius: 30px;
            box-shadow: 0 4px 15px rgba(214, 48, 49, .45);
            opacity: 0; animation: aparecerLink 2s ease 11s forwards;
        }
        a.siguiente:hover { filter: brightness(1.1); }
        @keyframes aparecerLink { to { opacity: 1; } }
        @media (max-width: 600px) {
            h1 { font-size: 3rem; }
            h2 { font-size: 1rem; }
            .jardin { width: 120px; bottom: -6px; }
        }
    </style>
</head>
<body>

    <canvas id="lienzo"></canvas>
    
    <div class="textos">
        <h1>Te amo, Sarah</h1>
        <h2>ya viste que llueven boneless? cuando hize esto me antoje :D</h2>
        <h3 class="pd">P.D. Silver también te manda un ronroneo 🐾</h3>
    </div>

    <a class="siguiente" href="sarah.html">🌸 Un último regalo →</a>

    <div class="jardin izq" id="jardin-izq"></div>
    <div class="jardin der" id="jardin-der"></div>

    <script>
        const canvas = document.getElementById('lienzo');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let lluviaBoneless = [];

        // --- SISTEMA DE LLUVIA DE BONELESS (ESTILO KFC) ---
        class Boneless {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * -canvas.height * 2; 
                this.velocidadY = Math.random() * 2 + 1; 
                this.velocidadX = (Math.random() - 0.5) * 1.5; 
                this.rotacion = Math.random() * 360;
                this.velocidadRotacion = (Math.random() - 0.5) * 2;
                
                this.bultos = [];
                const cantidadBultos = Math.floor(Math.random() * 3) + 4; 
                for (let i = 0; i < cantidadBultos; i++) {
                    this.bultos.push({
                        x: (Math.random() - 0.5) * 25,
                        y: (Math.random() - 0.5) * 25,
                        r: Math.random() * 10 + 8
                    });
                }
                this.colorSalsa = '#e67e22'; 
            }

            actualizar() {
                this.y += this.velocidadY;
                this.x += this.velocidadX;
                this.rotacion += this.velocidadRotacion;

                if (this.y > canvas.height + 50) {
                    this.y = -50;
                    this.x = Math.random() * canvas.width;
                }
            }

            dibujar() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotacion * Math.PI / 180);
                
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 5;
                ctx.shadowOffsetX = 3;
                ctx.shadowOffsetY = 3;

                ctx.fillStyle = this.colorSalsa;
                ctx.beginPath();
                this.bultos.forEach(b => {
                    ctx.moveTo(b.x, b.y);
                    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                });
                ctx.fill();

                ctx.shadowColor = 'transparent';
                ctx.fillStyle = 'rgba(255, 255, 255, 0.15)'; 
                
                this.bultos.forEach(b => {
                    ctx.beginPath();
                    ctx.arc(b.x - b.r/3, b.y - b.r/3, b.r/4, 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.restore();
            }
        }

        for (let i = 0; i < 35; i++) {
            lluviaBoneless.push(new Boneless());
        }

        // --- SISTEMA DEL CORAZÓN MATEMÁTICO ---
        const lineasCorazon = [];
        let indiceCorazon = 0; 
        
        for (let i = 0; i < 320; i++) {
            let a = 2 * Math.PI * i / 320;
            let x = 16 * Math.pow(Math.sin(a), 3);
            let y = 13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a);
            y = -y; 
            
            let scale = 22; // MODIFICADO: Aumentado de 14 a 22 para un corazón más grande
            let xo = x * scale;
            let yo = y * scale;
            let L = 0.15 + Math.random() * 0.35; 
            let x1 = xo * (1 - L);
            let y1 = yo * (1 - L);
            
            lineasCorazon.push({ xo, yo, x1, y1 });
        }

        // --- SISTEMA DE LA AMAPOLA ESTILO "NEÓN MATEMÁTICO" ---
        function crearAmapolaNeon() {
            const offCanvas = document.createElement('canvas');
            const octx = offCanvas.getContext('2d');
            offCanvas.width = 600;
            offCanvas.height = 800; 

            const cx = 300;
            const cy = 250; 

            octx.lineCap = "round";
            octx.lineJoin = "round";

            octx.beginPath();
            octx.moveTo(cx, cy + 20);
            octx.bezierCurveTo(cx - 30, cy + 200, cx + 50, cy + 400, cx - 60, cy + 550);
            octx.strokeStyle = '#7bed9f';
            octx.lineWidth = 4;
            octx.shadowColor = '#2ed573';
            octx.shadowBlur = 15;
            octx.stroke();

            function dibujarHojaNeon(startX, startY, tipX, tipY, ctrlX, ctrlY) {
                for (let i = 0; i <= 20; i++) {
                    let t = i / 20;
                    let edgeX = startX * Math.pow(1-t, 2) + ctrlX * 2 * (1-t) * t + tipX * Math.pow(t, 2);
                    let edgeY = startY * Math.pow(1-t, 2) + ctrlY * 2 * (1-t) * t + tipY * Math.pow(t, 2);

                    octx.beginPath();
                    octx.moveTo(startX, startY);
                    
                    let veinCtrlX = startX + (edgeX - startX) * 0.5 + (tipY - startY) * 0.1;
                    let veinCtrlY = startY + (edgeY - startY) * 0.5 - (tipX - startX) * 0.1;
                    octx.quadraticCurveTo(veinCtrlX, veinCtrlY, edgeX, edgeY);

                    octx.strokeStyle = `rgba(120, 255, 150, ${0.1 + t*0.3})`;
                    octx.lineWidth = 1.5;
                    octx.shadowBlur = 5;
                    octx.shadowColor = '#2ed573';
                    octx.stroke();
                }
            }
            
            dibujarHojaNeon(cx - 15, cy + 180, cx - 220, cy + 80, cx - 180, cy + 250);
            dibujarHojaNeon(cx - 15, cy + 180, cx - 220, cy + 80, cx - 60, cy + 60);
            
            dibujarHojaNeon(cx + 20, cy + 300, cx + 250, cy + 150, cx + 200, cy + 350);
            dibujarHojaNeon(cx + 20, cy + 300, cx + 250, cy + 150, cx + 100, cy + 150);

            octx.shadowBlur = 12;
            octx.shadowColor = '#ff4757';
            
            for (let layer = 0; layer < 2; layer++) { 
                let numPetalos = 6;
                let offsetRot = layer * (Math.PI / numPetalos);
                
                for (let p = 0; p < numPetalos; p++) {
                    let baseAng = (p * 2 * Math.PI) / numPetalos + offsetRot;
                    
                    for (let i = -25; i <= 25; i+=0.5) {
                        let f = i / 25; 
                        let ang = baseAng + f * 0.65; 
                        let length = (layer === 0 ? 170 : 120) - Math.abs(f) * 40;
                        length += Math.sin(i * 0.5) * 10; 

                        let startX = cx + Math.cos(ang) * 25;
                        let startY = cy + Math.sin(ang) * 25;
                        let endX = cx + Math.cos(ang) * length;
                        let endY = cy + Math.sin(ang) * length;

                        let cpAng = ang + 0.5 * Math.sign(f);
                        let cpDist = length * 0.7;
                        let cpX = cx + Math.cos(cpAng) * cpDist;
                        let cpY = cy + Math.sin(cpAng) * cpDist;

                        octx.beginPath();
                        octx.moveTo(startX, startY);
                        octx.quadraticCurveTo(cpX, cpY, endX, endY);

                        let red = 255;
                        let green = layer === 0 ? 40 + Math.abs(f)*60 : 70;
                        let blue = layer === 0 ? 80 + Math.abs(f)*80 : 130;
                        octx.strokeStyle = `rgba(${red}, ${green}, ${blue}, 0.5)`;
                        octx.lineWidth = 1.2;
                        octx.stroke();
                    }
                }
            }

            octx.shadowBlur = 0;
            octx.fillStyle = '#1e272e';
            octx.beginPath();
            octx.arc(cx, cy, 38, 0, Math.PI * 2);
            octx.fill();

            for(let i = 0; i < 360; i += 7) {
                let a = i * Math.PI/180;
                octx.beginPath();
                octx.moveTo(cx + Math.cos(a)*38, cy + Math.sin(a)*38);
                octx.lineTo(cx + Math.cos(a)*60, cy + Math.sin(a)*60);
                octx.strokeStyle = 'rgba(255, 200, 100, 0.4)';
                octx.lineWidth = 1.5;
                octx.stroke();
                
                octx.beginPath();
                octx.arc(cx + Math.cos(a)*60, cy + Math.sin(a)*60, 2, 0, Math.PI*2);
                octx.fillStyle = '#f6e58d';
                octx.fill();
            }

            octx.shadowBlur = 4;
            octx.shadowColor = '#f39c12';
            for (let i = 0; i < 180; i++) {
                let a = i * 137.5 * (Math.PI / 180);
                let r = 2.6 * Math.sqrt(i);
                let x = cx + r * Math.cos(a);
                let y = cy + r * Math.sin(a);
                
                octx.beginPath();
                octx.arc(x, y, 1.5, 0, Math.PI * 2);
                octx.fillStyle = (i % 3 === 0) ? '#f1c40f' : '#e67e22';
                octx.fill();
            }

            return offCanvas;
        }

        const imagenFlorNeon = crearAmapolaNeon();

        // --- BUCLE PRINCIPAL DE ANIMACIÓN ---
        function animar() {
            ctx.fillStyle = 'rgba(9, 10, 15, 0.2)'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            let centroX = canvas.width / 2;
            let centroY = canvas.height / 2 - 80;

            // 1. Dibujar boneless en el fondo
            lluviaBoneless.forEach(b => {
                b.actualizar();
                b.dibujar();
            });

            // 2. Dibujar la amapola neón estática
            ctx.drawImage(imagenFlorNeon, centroX - 300, centroY - 250);

            // 3. Dibujar y animar el CORAZÓN MATEMÁTICO abrazando la flor
            ctx.save();
            ctx.translate(centroX, centroY); 

            if (indiceCorazon < 320) {
                indiceCorazon += 0.3; // MODIFICADO: Reducido drásticamente de 2.5 a 0.3 para formación muy lenta
            }

            for (let i = 0; i < Math.min(indiceCorazon, lineasCorazon.length); i++) {
                let linea = lineasCorazon[i];
                
                for(let j = 0; j < 10; j++) {
                    let f = j / 10;
                    let r = Math.floor((1 - 0.6 * f) * 255);
                    let g = Math.floor((0.7 * (1 - f)) * 255);
                    let b = Math.floor((0.8 * (1 - f)) * 255);
                    
                    ctx.strokeStyle = `rgb(${r}, ${g}, ${b})`;
                    ctx.lineWidth = 1.5;
                    
                    ctx.beginPath();
                    let startX = linea.xo + (linea.x1 - linea.xo) * f;
                    let startY = linea.yo + (linea.y1 - linea.yo) * f;
                    let endX = linea.xo + (linea.x1 - linea.xo) * (f + 0.1);
                    let endY = linea.yo + (linea.y1 - linea.yo) * (f + 0.1);
                    
                    ctx.moveTo(startX, startY);
                    ctx.lineTo(endX, endY);
                    ctx.stroke();
                }
            }
            ctx.restore();

            requestAnimationFrame(animar);
        }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        animar();

        // === SUCULENTAS (dibujadas en SVG) ===
        const Sucu = (() => {
            let uid = 0;
            const f = n => +n.toFixed(2);

            function maceta(c1, c2, ancho = 40) {
                const h = ancho / 2;
                return `<path d="M${50 - h + 4},76 L${50 + h - 4},76 L${50 + h - 9},99 Q50,103 ${50 - h + 9},99 Z" fill="${c1}"/>` +
                       `<rect x="${50 - h - 3}" y="72" width="${ancho + 6}" height="8" rx="3.5" fill="${c2}"/>` +
                       `<rect x="${50 - h - 3}" y="72" width="${ancho + 6}" height="3" rx="1.5" fill="#fff" opacity=".25"/>`;
            }

            // Roseta tipo echeveria: capas de pétalos con la puntita de otro color
            function roseta({ petalos, largo, ancho, colores, punta }) {
                let defs = '', body = '';
                petalos.forEach((n, i) => {
                    const id = 'sg' + (uid++);
                    const L = largo * (1 - i * 0.17), W = ancho * (1 - i * 0.09);
                    defs += `<linearGradient id="${id}" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="${colores[i]}"/><stop offset=".72" stop-color="${colores[i]}"/><stop offset="1" stop-color="${punta}"/></linearGradient>`;
                    const d = `M0,0 C${f(-W)},${f(-L * .35)} ${f(-W * .9)},${f(-L * .92)} 0,${f(-L)} C${f(W * .9)},${f(-L * .92)} ${f(W)},${f(-L * .35)} 0,0Z`;
                    for (let k = 0; k < n; k++) {
                        const a = k * 360 / n + (i % 2) * (180 / n) + i * 7;
                        body += `<path d="${d}" transform="rotate(${f(a)})" fill="url(#${id})" stroke="rgba(0,0,0,.14)" stroke-width=".6"/>`;
                    }
                });
                return { defs, body };
            }

            const grupo = (r, x, y, s = 1) => `<g transform="translate(${x},${y}) scale(${s},${f(s * .82)})">${r.body}</g>`;

            function aloe() {
                const id = 'sg' + (uid++);
                const defs = `<linearGradient id="${id}" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#3b8f68"/><stop offset="1" stop-color="#a9e6b8"/></linearGradient>`;
                const hojas = [[-66, 32], [66, 32], [-46, 40], [46, 40], [-24, 47], [24, 47], [0, 52]];
                let body = '';
                hojas.forEach(([a, L]) => {
                    body += `<path d="M0,0 C-6,${f(-L * .3)} -5,${f(-L * .8)} 0,${-L} C5,${f(-L * .8)} 6,${f(-L * .3)} 0,0Z" transform="translate(50,76) rotate(${a})" fill="url(#${id})" stroke="rgba(0,0,0,.15)" stroke-width=".6"/>`;
                    for (let j = 1; j <= 3; j++) {
                        body += `<circle r=".9" fill="#fff" opacity=".7" transform="translate(50,76) rotate(${a}) translate(${j % 2 ? -1.4 : 1.4},${f(-L * j * .22)})"/>`;
                    }
                });
                return { defs, body };
            }

            // Flor de suculenta (cinco pétalos)
            function flor(x, y, r = 5, c = '#ff7f9a') {
                let s = `<g transform="translate(${x},${y})">`;
                for (let k = 0; k < 5; k++) {
                    s += `<ellipse cx="0" cy="${f(-r * .8)}" rx="${f(r * .42)}" ry="${f(r * .85)}" transform="rotate(${k * 72})" fill="${c}" stroke="rgba(0,0,0,.1)" stroke-width=".4"/>`;
                }
                return s + `<circle r="${f(r * .3)}" fill="#ffe066"/></g>`;
            }

            function svg(tipo) {
                let defs = '', body = '';
                if (tipo === 'A') { // verde con puntitas rosas
                    const r = roseta({ petalos: [11, 9, 7, 5, 3], largo: 34, ancho: 13, colores: ['#6fae94', '#7fbfa2', '#92cdb0', '#a8dcc0', '#c2ebd2'], punta: '#ff8fa8' });
                    defs = r.defs; body = maceta('#c8754f', '#dd8a62') + grupo(r, 50, 56);
                } else if (tipo === 'B') { // lavanda
                    const r = roseta({ petalos: [12, 9, 7, 5, 3], largo: 32, ancho: 12, colores: ['#8c84cf', '#9d96dc', '#b1abe8', '#c6c1f3', '#ddd9fb'], punta: '#f6a8d2' });
                    defs = r.defs; body = maceta('#e9ecf2', '#f8f9fc') + grupo(r, 50, 56);
                } else if (tipo === 'C') { // aloe / haworthia
                    const r = aloe();
                    defs = r.defs; body = maceta('#ee9fb0', '#f8b9c6') + r.body;
                } else if (tipo === 'D') { // con flores
                    const r = roseta({ petalos: [10, 8, 6, 4], largo: 28, ancho: 11, colores: ['#5fa08d', '#72b3a0', '#88c6b3', '#a3d9c6'], punta: '#9ee0c9' });
                    defs = r.defs;
                    body = maceta('#b9a6ee', '#cdbcf6') + grupo(r, 50, 60) +
                        `<g fill="none" stroke="#5fa88a" stroke-width="2.2" stroke-linecap="round"><path d="M50,52 C48,34 56,24 58,12"/><path d="M52,38 C50,32 48,28 47,24"/><path d="M54,30 C60,30 62,28 64,26"/></g>` +
                        flor(58, 11, 5.5) + flor(47, 23, 4.5, '#ff9bb0') + flor(64, 25, 4.5, '#ff7f9a');
                } else { // racimo rosado
                    const col = { petalos: [10, 8, 6, 4, 3], largo: 28, ancho: 11, colores: ['#e79a9a', '#f0aeae', '#f6c3bd', '#fbd8cf', '#fff0e6'], punta: '#ff6f91' };
                    const r1 = roseta(col), r2 = roseta(col), r3 = roseta(col);
                    defs = r1.defs + r2.defs + r3.defs;
                    body = maceta('#a9dcc7', '#c2ecd9', 54) + grupo(r1, 32, 64, .62) + grupo(r2, 68, 62, .55) + grupo(r3, 50, 58, .8);
                }
                return `<svg viewBox="0 0 100 104" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>${defs}</defs>${body}</svg>`;
            }

            // lista: [['A', 90], ['C', 70], ...] -> tipo y ancho en px
            function montar(el, lista) {
                lista.forEach(([tipo, w], i) => {
                    const d = document.createElement('div');
                    d.className = 'sucu';
                    d.style.setProperty('--w', w + 'px');
                    d.style.setProperty('--d', (0.4 + i * 0.28 + Math.random() * 0.2).toFixed(2) + 's');
                    d.innerHTML = svg(tipo);
                    el.appendChild(d);
                });
            }
            return { montar, svg };
        })();
        Sucu.montar(document.getElementById('jardin-izq'), [['A', 78], ['C', 60]]);
        Sucu.montar(document.getElementById('jardin-der'), [['D', 66], ['B', 70]]);
    </script>
</body>
</html>
